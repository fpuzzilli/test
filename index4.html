<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Serie A — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07090F; --surf:#0F1420; --surf2:#161C2C;
  --bdr:rgba(255,255,255,0.07);
  --gold:#D4A017; --golds:rgba(212,160,23,0.1);
  --txt:#DDE4F0; --mut:#5A6478;
  --grn:#27AE60; --amb:#F39C12; --red:#E74C3C;
  --blu:#0099FF; --pur:#FF7300; --tea:#00FF41;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  height:100%;
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',system-ui,sans-serif;
  height:100%;
  display:flex;flex-direction:column;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── BAR ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(7,9,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);z-index:10}
.bar-in{max-width:1320px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:2px;overflow:hidden}.badge svg{width:100%;height:100%}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.3px}
.brand p{font-size:11px;color:var(--mut);margin-top:1px}
.strow{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grn);flex-shrink:0}
#stTxt{font-size:12px;color:var(--mut)}

/* ── DASHBOARD — always two columns, fills body height ── */
.dash{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:20px;
  max-width:1320px;margin:0 auto;
  padding:20px 24px;
  align-items:stretch;
  flex:1;min-height:0; /* fill remaining viewport after bar */
}

/* Left column: standings fills full column height */
.col-left{display:flex;flex-direction:column}
.col-left .card{flex:1;overflow-y:auto;display:flex;flex-direction:column}
/* Standings rows stretch to fill the card */
#tbl .trow.hd{flex-shrink:0}
#tbl .trow.dr{flex:1;min-height:26px}

/* Right column: two panels split height equally */
.col-right{display:flex;flex-direction:column;gap:24px}
.day-sec{flex:1;display:flex;flex-direction:column}
.day-sec .card{flex:1;overflow-y:auto;display:flex;flex-direction:column}
/* Match rows stretch to fill the card */
.day-sec .card .mrow{flex:1;min-height:26px;display:flex;flex-direction:column;justify-content:center}

/* ── PANEL HEADER ── */
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-shrink:0}
.slabel{font-size:10px;font-weight:600;color:var(--mut);letter-spacing:1.2px;text-transform:uppercase}
.hdr-side{font-size:11px;color:var(--mut);white-space:nowrap}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}

/* Label variants: full on desktop, short on mobile */
.lbl-m{display:none}

/* ── STANDINGS ── */
/* col order: # | Squadra | Pts | G | V | N | P | DR */
.trow{display:grid;grid-template-columns:30px 1fr 46px 30px 30px 30px 30px 38px;padding:8px 14px;align-items:center}
.trow.hd{font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;border-bottom:1px solid var(--bdr)}
.trow.dr{border-bottom:1px solid var(--bdr);font-size:12px;transition:background .12s}
.trow.dr:last-child{border-bottom:none}
.trow.dr:hover{background:var(--surf2)}
.trow.ucl{border-left:3px solid var(--blu)}
.trow.uel{border-left:3px solid var(--pur)}
.trow.uecl{border-left:3px solid var(--tea)}
.trow.rel{border-left:3px solid #9B59B6}
.tp{grid-column:1;text-align:center;font-weight:600;font-size:11px;color:var(--mut)}
.tt{grid-column:2;display:flex;align-items:center;gap:8px;overflow:hidden}
.tt span{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.tpt{grid-column:3;text-align:center;font-weight:700;font-size:13px}
.tg{grid-column:4;text-align:center;color:var(--mut);font-size:12px}
.tv{grid-column:5;text-align:center;color:var(--mut);font-size:12px}
.tn2{grid-column:6;text-align:center;color:var(--mut);font-size:12px}
.tl{grid-column:7;text-align:center;color:var(--mut);font-size:12px}
.tgd{grid-column:8;text-align:center;color:var(--mut);font-size:12px}

/* ── MATCH ROWS ── */
.mrow{border-bottom:1px solid var(--bdr)}
.mrow:last-child{border-bottom:none}
.mrow.live{background:linear-gradient(90deg,transparent,var(--golds),transparent)}

/* Desktop layout (grid) */
.m-desk{display:grid;grid-template-columns:1fr 58px 1fr 46px;padding:9px 14px;align-items:center;gap:8px}
.mh{text-align:right;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ma{text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.msc{text-align:center;font-weight:700;font-size:13px;letter-spacing:.3px}
.msc.ns{font-size:11px;font-weight:400;color:var(--mut);font-style:italic}
.mbg{text-align:right;font-size:10px;font-weight:600;white-space:nowrap}
.mbg.ft{color:var(--mut)}
.mbg.live{color:var(--amb);animation:blink 1.5s ease infinite}
.mbg.ns{color:var(--mut);font-weight:400;font-size:11px}

/* Mobile compact layout — teams sempre a sx, info a dx */
.m-mob{display:none;grid-template-columns:1fr 44px;padding:7px 8px;align-items:center;gap:6px;font-size:11px;font-weight:600}
.mm-t{white-space:nowrap;letter-spacing:.2px} /* no ellipsis */
.mm-s{text-align:right;font-size:11px;white-space:nowrap}
.mm-date{text-align:right;font-size:10px;font-weight:400;color:var(--mut);white-space:nowrap}
.mm-live{color:var(--amb);animation:blink 1.5s ease infinite}

.trow.roma{background:rgba(200,255,0,.1)}
.trow.roma:hover{background:rgba(200,255,0,.17)}
.mrow.roma{background:rgba(245,255,0,.08)!important}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.dot.ok{background:var(--grn)}
.dot.busy{background:var(--amb);animation:blink 1s ease infinite}
.dot.err{background:var(--red)}
.spin-state{display:flex;align-items:center;justify-content:center;height:100%}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid var(--bdr);border-top-color:var(--gold);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MEDIUM (≤ 600px): remove secondary stats from standings ── */
@media(max-width:600px){
  .dash{padding:14px 12px;gap:12px}
  .bar-in{padding:11px 14px}
  .trow{grid-template-columns:28px 1fr 42px 28px 36px;padding:7px 11px}
  .tv,.tn2,.tl{display:none}
  .tgd{grid-column:5}
}

/* ── MOBILE (≤ 460px): full compact mode ── */
@media(max-width:460px){
  .dash{padding:8px;gap:8px}
  .col-right{gap:8px}
  .panel-hdr{margin-bottom:5px}

  /* Altezze minime ridotte per il compatto */
  #tbl .trow.dr{min-height:18px}
  .day-sec .card .mrow{min-height:20px}

  /* Short labels */
  .lbl-d{display:none}
  .lbl-m{display:inline}
  .panel-hdr .hdr-side{display:none}

  /* Standings: # | Squadra | Pts only, no header */
  .trow{grid-template-columns:20px 1fr 34px;padding:5px 8px}
  .trow.hd{display:none}
  .tg,.tv,.tn2,.tl,.tgd{display:none}
  .tpt{grid-column:3;font-size:11px}

  /* Compact match format */
  .m-desk{display:none}
  .m-mob{display:grid}
}

@media(prefers-reduced-motion:reduce){.mbg,.mm-live{animation:none}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">
      <div class="badge"><svg viewBox="0 0 642.858 637.143" xmlns="http://www.w3.org/2000/svg"><path fill="#fd9504" d="M305.493-34.205C240.9 1.45 193.598 47.583 191.566 121.153l-128.573-87.5c-23.684 22.836-97.6 157.312-15.712 245l-67.858 38.57 66.428 53.572-76.428 56.428 87.858 23.572-136.43 152.143 212.142-48.572.715 47.142 98.573-46.427-.715 47.142 45.715-37.142 23.57-2.143c33.409 17.738 64.241 42.994 110 37.143 48.909-6.254 59.982-36.676 77.142-62.858l-63.57-.715-48.572 28.573-4.285-29.286-29.287-1.43-7.856-27.857h-25.715l-2.857-17.855c-26.884 2.237-35.787-16.504-40-40.715 72.918-6.706 160.582 35.037 207.142 53.57l90.715-61.427-103.572-117.858-.713-125.713-86.43-66.43Zm-2.189 318.852c30.041-.34 61.074 12.81 78.975 47.576-6.132 6.912-81.123 49.471-143.57-23.57 15.494-14.182 39.704-23.725 64.595-24.006z" transform="translate(79.15 34.205)"/></svg></div>
      <div><h1>Serie A Roma 2026/27</h1><p>Live Dashboard</p></div>
    </div>
    <div class="strow">
      <div class="dot busy" id="dot"></div>
      <span id="stTxt">Caricamento…</span>
    </div>
  </div>
</div>

<div class="dash">

  <!-- ══ SINISTRA: CLASSIFICA ══ -->
  <div class="col-left">
    <div class="panel-hdr">
      <span class="slabel">Classifica</span>
      <span class="hdr-side" id="standingsRound"></span>
    </div>
    <div class="card" id="tbl"></div>
  </div>

  <!-- ══ DESTRA: GIORNATE ══ -->
  <div class="col-right">

    <div class="day-sec">
      <div class="panel-hdr">
        <span class="slabel">
          <span class="lbl-d">Giornata in corso</span>
          <span class="lbl-m" id="curLblM">Giornata</span>
        </span>
        <span class="hdr-side" id="curRound"></span>
      </div>
      <div class="card" id="curCard"></div>
    </div>

    <div class="day-sec">
      <div class="panel-hdr">
        <span class="slabel">
          <span class="lbl-d">Prossima giornata</span>
          <span class="lbl-m" id="nxtLblM">Giornata</span>
        </span>
        <span class="hdr-side" id="nxtRound"></span>
      </div>
      <div class="card" id="nxtCard"></div>
    </div>

  </div>
</div>

<script>
/* ── ABBREVIAZIONI CLASSICHE SERIE A ── */
const ABBR = {
  'Inter':'INT','AC Milan':'MIL','Napoli':'NAP','Juventus':'JUV',
  'Atalanta':'ATA','Lazio':'LAZ','Roma':'ROM','Fiorentina':'FIO',
  'Torino':'TOR','Bologna':'BOL','Udinese':'UDI','Genoa':'GEN',
  'Cagliari':'CAG','Monza':'MON','Empoli':'EMP','Venezia':'VEN',
  'Lecce':'LEC','Como':'COM','Parma':'PAR','Hellas Verona':'VER',
};
const ab = n => ABBR[n] || n.slice(0,3).toUpperCase();

/* ── CONFIGURAZIONE API-FOOTBALL ── */
const API_KEY = '54fbc6dec017b4194df3cbf86da2a82f';
const LEAGUE  = 135;   // Serie A
const SEASON  = 2026;
const BASE    = 'https://v3.football.api-sports.io';

async function apiFetch(path) {
  const r = await fetch(BASE + path, { headers: { 'x-apisports-key': API_KEY } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  // Gestisci errori API sia in formato oggetto che array
  if (d.errors) {
    const vals = Array.isArray(d.errors) ? d.errors : Object.values(d.errors);
    if (vals.length) throw new Error(String(vals[0]));
  }
  return d;
}

/* ── COSTANTI STATUS ── */
const LIVE_ST = new Set(['1H','HT','2H','ET','P','BT']);
const FT_ST   = new Set(['FT','AET','PEN']);
const DAYS_IT = ['dom','lun','mar','mer','gio','ven','sab'];

function fmtTime(iso){
  const d = new Date(iso);
  return `${DAYS_IT[d.getDay()]} ${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`;
}

function zone(r){
  if(r<=4)return'ucl';if(r===5)return'uel';if(r===6)return'uecl';if(r>=18)return'rel';return'';
}

/* ── RENDER CLASSIFICA ── */
function renderStandings(rows){
  const hd=`<div class="trow hd">
    <div class="tp">#</div><div class="tt"><span>Squadra</span></div>
    <div class="tpt">Pts</div><div class="tg">G</div><div class="tv">V</div>
    <div class="tn2">N</div><div class="tl">P</div><div class="tgd">DR</div>
  </div>`;
  const body=rows.map(e=>{
    const z=zone(e.rank), gds=e.goalsDiff>0?'+'+e.goalsDiff:''+e.goalsDiff, isRoma=e.team.name==='Roma';
    return `<div class="trow dr ${z}${isRoma?' roma':''}">
      <div class="tp">${e.rank}</div>
      <div class="tt"><span>${e.team.name}</span></div>
      <div class="tpt">${e.points}</div>
      <div class="tg">${e.all.played}</div>
      <div class="tv">${e.all.win}</div>
      <div class="tn2">${e.all.draw}</div>
      <div class="tl">${e.all.lose}</div>
      <div class="tgd">${gds}</div>
    </div>`;
  }).join('');
  document.getElementById('tbl').innerHTML=hd+body;
}

function isToday(iso){
  const d=new Date(iso),n=new Date();
  return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();
}
function fmtMobileDate(iso){
  const d=new Date(iso);
  if(isToday(iso)) return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* ── RENDER PARTITE ── */
function renderFixtures(cardId, roundId, lblMId, fixtures){
  if(!fixtures?.length) return;

  const round = fixtures[0]?.league?.round || '';
  const num   = (round.match(/(\d+)$/) || [])[1] || '';
  document.getElementById(roundId).textContent  = num ? `${num}ª Giornata` : '';
  document.getElementById(lblMId).textContent   = `Giornata ${num}`;

  const rows = fixtures.map(f => {
    const st   = f.fixture.status.short;
    const isL  = LIVE_ST.has(st);
    const isFt = FT_ST.has(st);
    const hs   = f.goals.home;
    const as_  = f.goals.away;

    /* badge desktop */
    let badge;
    if      (isL && st==='HT') badge = 'HT';
    else if (isL)              badge = (f.fixture.status.elapsed??'•')+"'";
    else if (isFt)             badge = 'FT';
    else                       badge = fmtTime(f.fixture.date);

    /* desktop */
    const score = (isL||isFt) ? `${hs??'–'} – ${as_??'–'}` : 'vs';
    const bCls  = isL ? 'live' : isFt ? 'ft' : 'ns';

    /* mobile compact */
    const mTeams = `${ab(f.teams.home.name)} - ${ab(f.teams.away.name)}`;
    const mLive  = isL ? 'mm-live' : '';
    const mRight = (isL||isFt)
      ? `<span class="mm-s ${mLive}">${hs??'–'}-${as_??'–'}</span>`
      : `<span class="mm-date">${fmtMobileDate(f.fixture.date)}</span>`;

    const isRoma=f.teams.home.name==='Roma'||f.teams.away.name==='Roma';
    return `<div class="mrow ${isL?'live':''}${isRoma?' roma':''}">
      <div class="m-desk">
        <div class="mh">${f.teams.home.name}</div>
        <div class="msc ${!isL&&!isFt?'ns':''}">${score}</div>
        <div class="ma">${f.teams.away.name}</div>
        <div class="mbg ${bCls}">${badge}</div>
      </div>
      <div class="m-mob">
        <span class="mm-t">${mTeams}</span>
        ${mRight}
      </div>
    </div>`;
  }).join('');

  document.getElementById(cardId).innerHTML = rows;
}

/* ── INIT & AUTO-REFRESH ── */
let _rt = null; // refresh timer

function setStatus(s, msg) {
  document.getElementById('dot').className = 'dot ' + s;
  document.getElementById('stTxt').textContent = msg;
}

function showSpinners() {
  ['tbl','curCard','nxtCard'].forEach(id => {
    document.getElementById(id).innerHTML =
      '<div class="spin-state"><div class="spinner"></div></div>';
  });
}

function hasLive(fx) {
  return (fx||[]).some(f => LIVE_ST.has(f.fixture.status.short));
}

async function loadAll() {
  setStatus('busy', 'Aggiornamento…');
  showSpinners();
  if (_rt) clearTimeout(_rt);

  try {
    // 1. Classifica (contiene anche il round corrente)
    const sd = await apiFetch(`/standings?league=${LEAGUE}&season=${SEASON}`);
    if (!sd.response?.length) throw new Error(`Nessun dato (league=${LEAGUE} season=${SEASON})`);

    const league    = sd.response[0].league;
    const standings = league.standings[0];
    const curRound  = league.round || '';
    const roundNum  = parseInt((curRound.match(/(\d+)$/) || [])[1] || 1);
    const nxtRound  = `Regular Season - ${roundNum + 1}`;

    // 2. Partite giornata corrente e prossima (parallelo)
    const [cd, nd] = await Promise.all([
      apiFetch(`/fixtures?league=${LEAGUE}&season=${SEASON}&round=${encodeURIComponent(curRound)}`),
      apiFetch(`/fixtures?league=${LEAGUE}&season=${SEASON}&round=${encodeURIComponent(nxtRound)}`)
    ]);

    const curFx = cd.response || [];
    const nxtFx = nd.response || [];

    // 3. Render
    renderStandings(standings);
    document.getElementById('standingsRound').textContent = fmtRound(curRound);
    renderFixtures('curCard', 'curRound', 'curLblM', curFx);
    renderFixtures('nxtCard', 'nxtRound', 'nxtLblM', nxtFx);

    const t = new Date();
    setStatus('ok', `Agg. ${t.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`);

    // Live → aggiorna ogni 60s, altrimenti ogni 5 min
    _rt = setTimeout(loadAll, hasLive(curFx) ? 60_000 : 300_000);

  } catch(err) {
    const msg = err.message || 'Errore sconosciuto';
    setStatus('err', msg);
    console.error('[Serie A]', err);
    // Mostra errore nei card (con messaggio visibile per debug)
    ['tbl','curCard','nxtCard'].forEach(id => {
      document.getElementById(id).innerHTML =
        `<div class="spin-state" style="flex-direction:column;gap:10px;padding:24px;text-align:center">
          <div style="font-size:22px">⚠️</div>
          <div style="font-size:11px;color:var(--red);line-height:1.5;max-width:220px">${msg}</div>
          <button onclick="loadAll()" style="background:none;border:1px solid var(--bdr);color:var(--mut);cursor:pointer;border-radius:6px;padding:5px 14px;font-size:11px;font-family:inherit;margin-top:4px">↻ Riprova</button>
        </div>`;
    });
    _rt = setTimeout(loadAll, 120_000);
  }
}

loadAll();

</script>
</body>
</html>
